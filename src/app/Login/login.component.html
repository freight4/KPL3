
<div class="login-page">

  <div class="login-card">

    <h1>Pokémon League</h1>
    <p class="subtitle">Welcome to the KPL!</p>

    <div class="login-options">

      <button class="discord-button" (click)="loginWithDiscord()">
        Login with Discord
      </button>

      <div class="divider">
        <span>OR</span>
      </div>

      <button class="guest-button" (click)="continueAsGuest()">
        Continue as Guest
      </button>

    </div>

  </div>

</div>

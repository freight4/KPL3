
<div class="create-team-page">

  <!-- BACKGROUND -->
  <div class="create-team-background"></div>

  <!-- POKEBALL TRANSITION OVERLAY -->
  <app-pokeball-transition
    [active]="showPokeballAnimation">
  </app-pokeball-transition>

  <div class="create-team-content">

    <div class="create-team-card">

      <h2>Enter Team Name</h2>

      <p>
        You're almost ready! Choose a name for your team
        before entering the league.
      </p>

      <!-- TEAM NAME INPUT -->
      <div class="team-input">

        <label for="teamName">Team Name</label>

        <input
          id="teamName"
          type="text"
          [(ngModel)]="teamName"
          name="teamName"
          placeholder="Enter your team name"
          maxlength="100"
          [disabled]="isSaving || showPokeballAnimation"
          (keyup.enter)="playPokeballAnimation()"
        />

      </div>

      <!-- ERROR MESSAGE -->
      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }

      <!-- CREATE TEAM BUTTON -->
      <button
      class="create-button"
      [disabled]="isSaving || !teamName.trim() || showPokeballAnimation"
      (click)="playPokeballAnimation()">

      {{ isSaving ? 'Creating Team...' : 'Create Team →' }}

      </button>

    </div>

  </div>
</div>
